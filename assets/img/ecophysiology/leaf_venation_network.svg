  <path d="M140,142 Q162,145 185,154" fill="none" stroke="#4a8a4a" stroke-width="1.2"/>
  <!-- Tertiary cross-links - left -->
  <line x1="100" y1="50" x2="96" y2="70" stroke="#8aba8a" stroke-width="0.9"/>
  <line x1="80"  y1="57" x2="76" y2="77" stroke="#8aba8a" stroke-width="0.9"/>
  <line x1="88"  y1="76" x2="84" y2="96" stroke="#8aba8a" stroke-width="0.9"/>
  <line x1="72"  y1="82" x2="68" y2="102" stroke="#8aba8a" stroke-width="0.9"/>
  <line x1="96"  y1="96" x2="93" y2="116" stroke="#8aba8a" stroke-width="0.9"/>
  <!-- Tertiary cross-links - right -->
  <line x1="180" y1="50" x2="184" y2="70" stroke="#8aba8a" stroke-width="0.9"/>
  <line x1="200" y1="57" x2="204" y2="77" stroke="#8aba8a" stroke-width="0.9"/>
  <line x1="192" y1="76" x2="196" y2="96" stroke="#8aba8a" stroke-width="0.9"/>
  <line x1="208" y1="82" x2="212" y2="102" stroke="#8aba8a" stroke-width="0.9"/>
  <line x1="184" y1="96" x2="187" y2="116" stroke="#8aba8a" stroke-width="0.9"/>
