  <!-- Legend -->
  <line x1="18" y1="158" x2="42" y2="158" stroke="#2a5a2a" stroke-width="3"/>
  <text x="46" y="161" font-family="sans-serif" font-size="7.5" fill="#444">primary</text>
  <line x1="18" y1="170" x2="42" y2="170" stroke="#4a8a4a" stroke-width="1.5"/>
