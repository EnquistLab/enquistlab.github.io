  <path d="M140,142 Q118,145 95,154" fill="none" stroke="#4a8a4a" stroke-width="1.2"/>
  <!-- Secondary veins - right -->
  <path d="M140,38 Q175,45 212,62" fill="none" stroke="#4a8a4a" stroke-width="1.5"/>
  <path d="M140,65 Q175,70 222,83" fill="none" stroke="#4a8a4a" stroke-width="1.5"/>
  <path d="M140,92 Q175,96 225,106" fill="none" stroke="#4a8a4a" stroke-width="1.5"/>
